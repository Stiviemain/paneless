name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build (warnings are errors)
        run: dotnet build Paneless.slnx -c Release -warnaserror

      - name: Tests that need no device
        shell: pwsh
        run: |
          $out = dotnet run --project tests/Paneless.Smoke -c Release --no-build -- --groups | Out-String
          $out += dotnet run --project tests/Paneless.Smoke -c Release --no-build -- --scripts-parse | Out-String
          $out += dotnet run --project tests/Paneless.Smoke -c Release --no-build -- --automation | Out-String
          $out += dotnet run --project tests/Paneless.Smoke -c Release --no-build -- --translations | Out-String
          $out += dotnet run --project tests/Paneless.Smoke -c Release --no-build -- --assistants | Out-String
          $out += dotnet run --project tests/Paneless.Smoke -c Release --no-build -- --remote-apps | Out-String
          Write-Output $out
          if ($out -match 'FAIL') { throw 'A test failed.' }
