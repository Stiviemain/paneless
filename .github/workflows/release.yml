name: Release

# Push a tag like v1.0.0-beta.2: builds the Windows installer and attaches it to a draft release.
# Check the draft on GitHub, then publish it.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build installer
        shell: powershell
        run: .\build.ps1

      - name: Collect files and checksums
        id: files
        shell: pwsh
        run: |
          $version = ([xml](Get-Content -Raw src/Paneless.App/Paneless.App.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ("v$version" -ne "${{ github.ref_name }}" -and "${{ github.event_name }}" -eq 'push') { throw "Tag ${{ github.ref_name }} doesn't match <Version> $version" }
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item releases/PanelessApp-win-Setup.exe "dist/Paneless-$version-Setup.exe"
          Copy-Item releases/PanelessApp-win-Portable.zip "dist/Paneless-$version-Portable.zip"
          # Files for automatic updates (Paneless reads them from the newest release); keep their names.
          Copy-Item releases/releases.win.json dist/
          Copy-Item "releases/PanelessApp-$version-full.nupkg" dist/
          if (Test-Path releases/RELEASES) { Copy-Item releases/RELEASES dist/ }
          $hashes = @{}
          Get-ChildItem dist | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $hashes[$_.Name] = $h
            "{0}  {1}" -f $h, $_.Name
          } | Set-Content dist/SHA256SUMS.txt -Encoding ascii
          $setupName = "Paneless-$version-Setup.exe"
          $portName  = "Paneless-$version-Portable.zip"
          $runUrl = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          # Release notes: this version's section of CHANGELOG.md
          $log = Get-Content -Raw CHANGELOG.md
          $m = [regex]::Match($log, "(?ms)^## $([regex]::Escape($version)) .*?\r?\n(.*?)(?=^## |\z)")
          $notes = if ($m.Success) { $m.Groups[1].Value.Trim() } else { "See CHANGELOG.md." }
          $notes += "`n`n**Install:** download ``$setupName`` and run it (Windows 10/11, no admin rights). There is also a portable zip (``$portName``)."
          $notes += "`n`n**Verification:** Built publicly from this commit by [GitHub Actions]($runUrl) with GitHub build provenance attestations (``gh attestation verify``)."
          $notes += "`n- ``$setupName``: SHA-256 ``$($hashes[$setupName])`` · [VirusTotal](https://www.virustotal.com/gui/file/$($hashes[$setupName]))"
          $notes += "`n- ``$portName``: SHA-256 ``$($hashes[$portName])`` · [VirusTotal](https://www.virustotal.com/gui/file/$($hashes[$portName]))"
          Set-Content notes.md $notes -Encoding utf8
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/Paneless-*-Setup.exe
            dist/Paneless-*-Portable.zip

      - name: Draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.files.outputs.version }}"
          $extra = @()
          if ($v -match '-') { $extra += '--prerelease' }   # e.g. 1.0.0-beta.1
          gh release create "v$v" (Get-ChildItem dist).FullName --draft @extra --title "Paneless $v" --notes-file notes.md
